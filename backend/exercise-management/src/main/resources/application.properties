logging.level.org.springframework.security=DEBUG

spring.web.cors.allowed-origins=http://192.168.18.107:3000,http://localhost:3000,http://127.0.0.1:3000,http://10.92.18.105:3000,http://192.168.18.111:3000
spring.web.cors.allow-credentials=true

# Allowed methods
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Allowed headers
