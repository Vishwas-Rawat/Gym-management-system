<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; background:#f9f9f9; padding:20px;">
  <div style="max-width:600px; margin:auto; background:white; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.1);">
    <div style="background:#ff9800; color:white; padding:30px; text-align:center;">
      <h1>Membership Expiring Soon!</h1>
    </div>
    <div style="padding:30px; line-height:1.8; color:#333;">
      <p>Dear <strong th:text="${name}">Member</strong>,</p>
      <p>Your gym membership expires in <strong th:text="${daysRemaining}">X</strong> days!</p>
      <div style="background:#fff8e1; padding:20px; border-left:6px solid #ff9800; margin:25px 0; border-radius:8px;">
        <p><strong>Expiry Date:</strong> <span th:text="${expiryDate}">01 Jan 2025</span></p>
      </div>
      <p>Please renew soon to continue your fitness journey!</p>
      <div style="text-align:center; margin:30px 0;">
        <a href="http://localhost:5173/renew" style="background:#ff9800; color:white; padding:14px 32px; text-decoration:none; border-radius:8px; font-weight:bold; font-size:16px;">
          Renew Membership Now
        </a>
      </div>
    </div>
    <div style="background:#333; color:#ccc; padding:20px; text-align:center; font-size:13px;">
      © 2025 Your Gym Name. All rights reserved.
    </div>
  </div>
</body>
</html>
